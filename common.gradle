android {
    namespace "eu.kanade.tachiyomi.extension.${ext.pkgNameSuffix}"
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        versionCode ext.extVersionCode as Integer
        versionName "${ext.libVersion}.${ext.extVersionCode}"
        applicationId "eu.kanade.tachiyomi.extension.${ext.pkgNameSuffix}"
    }

    signingConfigs {
        release {
            if (file("${rootDir}/signingkey.p12").exists()) {
                storeFile file("${rootDir}/signingkey.p12")
                storePassword "tempestpass"
                keyAlias "tempest"
                keyPassword "tempestpass"
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            if (file("${rootDir}/signingkey.p12").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += "-opt-in=kotlinx.serialization.ExperimentalSerializationApi"
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ["src"]
            res.srcDirs = ["res"]
        }
    }
}

dependencies {
    compileOnly "com.github.tachiyomiorg:extensions-lib:1.4"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "org.jsoup:jsoup:1.17.2"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "io.reactivex:rxjava:1.3.8"
}

